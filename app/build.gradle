plugins { id 'com.android.application' }

android {
    namespace 'app.svideos.plus'
    compileSdk 35
    defaultConfig {
        applicationId 'app.svideos.plus'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '0.1.0-alpha.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('SVIDEOS_KEYSTORE')) {
                storeFile file(System.getenv('SVIDEOS_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('SVIDEOS_STORE_PASSWORD')
                keyAlias 'svideos'
                keyPassword System.getenv('SVIDEOS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SVIDEOS_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
