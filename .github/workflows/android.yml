name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore app signing key
        env:
          SIGNING_BASE64: ${{ secrets.SVIDEOS_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_BASE64"
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/svideos.p12"
      - name: Build and lint
        env:
          SVIDEOS_KEYSTORE: ${{ runner.temp }}/svideos.p12
          SVIDEOS_STORE_PASSWORD: ${{ secrets.SVIDEOS_STORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Enable hardware acceleration for release smoke test
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo chmod 666 /dev/kvm
      - name: Android launch and Back smoke test
        if: startsWith(github.ref, 'refs/tags/')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/android-smoke.cjs
      - name: Save Android launch screenshot
        if: startsWith(github.ref, 'refs/tags/') && always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-launch-smoke
          path: test-results/android-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: S-Videos-Plus-alpha-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish testing APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk S-Videos-Plus.apk
          gh release create "$GITHUB_REF_NAME" S-Videos-Plus.apk --prerelease --title "S Videos + ${GITHUB_REF_NAME}" --notes "Первая подписанная alpha для Android TV. Каталог, поиск, фильтры, D-pad и нативный Media3-плеер. Доступность сайтов зависит от сети и защиты самих источников. Требуется проверка на физическом ТВ."
